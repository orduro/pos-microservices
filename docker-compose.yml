services:
  gateway:
    image: gateway:latest
    container_name: gateway-dev
    build:
      context: ./gateway/
      dockerfile: Dockerfile.dev
    volumes:
      - ./gateway:/app
    environment:
      - SERVER_ADDR=:8080
      - ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=*
    ports:
      - "8080:8080"

  venue-service:
    image: venue-service:latest
    container_name: venue-service-dev
    build:
      context: ./venue-service/
      dockerfile: Dockerfile.dev
    volumes:
      - ./venue-service:/app
    environment:
      - SERVER_PORT=:8081
      - ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=*

      # PostgreSQL Configuration
      - POSTGRES_DSN=postgres://root:toor@venue-service-postgres:5432/venue_service_db?sslmode=disable
      - POSTGRES_MAX_OPEN_CONNS=25
      - POSTGRES_MAX_IDLE_CONNS=25
      - POSTGRES_MAX_IDLE_TIME=15m
    ports:
      - "8081:8081"
    depends_on:
      - venue-service-postgres

  auth-service:
    image: auth-service:latest
    container_name: auth-service-dev
    build:
      context: ./auth-service/
      dockerfile: Dockerfile.dev
    volumes:
      - ./auth-service:/app
    environment:
      - SERVER_PORT=:8082
      - ENVIRONMENT=dev
      - CORS_ALLOWED_ORIGINS=*

      # PostgreSQL Configuration
      - POSTGRES_DSN=postgres://root:toor@auth-service-postgres:5432/auth_service_db?sslmode=disable
      - POSTGRES_MAX_OPEN_CONNS=25
      - POSTGRES_MAX_IDLE_CONNS=25
      - POSTGRES_MAX_IDLE_TIME=15m
    ports:
      - "8082:8082"
    depends_on:
      - auth-service-postgres

  email-service:
    image: email-service:latest
    container_name: email-service-dev
    build:
      context: ./email-service/
      dockerfile: Dockerfile.dev
    volumes:
      - ./email-service:/app
    env_file:
      - ./email-service/.env
    ports:
      - "8083:8083"

  auth-service-postgres:
    image: postgres:latest
    container_name: auth-service-postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=toor
      - POSTGRES_DB=auth_service_db
    ports:
      - "5433:5432"
    volumes:
      - auth_service_postgres_data:/var/lib/postgresql/data

  venue-service-postgres:
    image: postgres:latest
    container_name: venue-service-postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=toor
      - POSTGRES_DB=venue_service_db
    ports:
      - "5432:5432"
    volumes:
      - venue_service_postgres_data:/var/lib/postgresql/data

volumes:
  auth_service_postgres_data:
  venue_service_postgres_data:
