services:
  gateway:
    image: gateway:latest
    container_name: gateway-dev
    build:
      context: ./gateway/
      dockerfile: Dockerfile.dev
    volumes:
      - ./gateway:/app
    environment:
      - SERVER_ADDR=:8080
      - ENVIRONMENT=dev
    ports:
      - "8080:8080"

  venue-service:
    image: venue-service:latest
    container_name: venue-service-dev
    build:
      context: ./venue/
      dockerfile: Dockerfile.dev
    volumes:
      - ./venue:/app
    environment:
      - SERVER_PORT=:8081
      - ENVIRONMENT=dev
    ports:
      - "8081:8081"
