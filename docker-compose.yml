services:
  gateway:
    image: gateway:latest
    container_name: gateway-dev
    build:
      context: ./gateway/
      dockerfile: Dockerfile.dev
    volumes:
      - ./gateway:/app
    environment:
      - SERVER_ADDR=:8080
      - ENVIRONMENT=dev
    ports:
      - "8080:8080"

  venue-service:
    image: venue-service:latest
    container_name: venue-service-dev
    build:
      context: ./venue-service/
      dockerfile: Dockerfile.dev
    volumes:
      - ./venue-service:/app
    environment:
      - SERVER_PORT=:8081
      - ENVIRONMENT=dev
      - VENUE_DB_USER=root
      - VENUE_DB_PASSWORD=toor
      - VENUE_DB_NAME=venue_service_db
    ports:
      - "8081:8081"
    depends_on:
      - venue-service-postgres

  venue-service-postgres:
    image: postgres:latest
    container_name: venue-service-postgres
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=toor
      - POSTGRES_DB=venue_service_db
    ports:
      - "5432:5432"
    volumes:
      - venue_service_postgres_data:/var/lib/postgresql/data

volumes:
  venue_service_postgres_data:
