events {
    worker_connections 1024;
}

http {
    # include upstream definitions
    include /etc/nginx/conf.d/upstreams.conf;
    
    server {
        listen 8080;
        server_name localhost;
        
        # include CORS configuration
        include /etc/nginx/conf.d/cors.conf;
        
        # health check for the gateway itself
        location /api/health {
            return 200 '{"service":"nginx-gateway","health":"alive","environment":"dev","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
        
        # include all service routes
        include /etc/nginx/conf.d/routes/*.conf;
        
        # default fallback for undefined routes
        location / {
            return 404 '{"error":"Route not found","message":"This endpoint is not configured in the gateway"}';
            add_header Content-Type application/json;
        }
    }
}
